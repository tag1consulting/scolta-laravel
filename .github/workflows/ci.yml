name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# COMPOSER_AUTH on the dependency-install steps: Composer resolves the
# tag1consulting/scolta-php VCS repo and every packagist dist through
# api.github.com. Unauthenticated that is 60 req/hour/IP, and when it runs dry
# composer cannot prompt under no-interaction and dies with "Could not
# authenticate against github.com" (AuthHelper.php:152, exit 100). The run's
# own token raises it to 1,000 req/hour/repo. Read-only is enough: scolta-php
# is public, so GITHUB_TOKEN can read it even though the token is scoped to
# this repository. Set per step, not workflow-wide (gha-workflow-env-secret):
# only `composer update` talks to the GitHub API, and a workflow-level secret
# is exposed to every step of every job.

jobs:
  test:
    name: test-${{ matrix.cell }}
    runs-on: ubuntu-latest
    strategy:
      # The cells are different resolutions of the same package; one failing
      # says nothing about the others. (The Drupal adapter sets this on its
      # integration matrix for the same reason; its unit matrix is two cells
      # and leaves it at the default.)
      fail-fast: false
      matrix:
        include:
          # Highest+lowest bracketing, the same shape as the Drupal adapter's
          # ci.yml: lowest = minimum supported PHP resolved with
          # --prefer-lowest, which proves the composer.json floors are real
          # rather than fiction; highest = newest supported PHP with the
          # newest resolution, and the only cell that lints — one canonical
          # style environment. Deliberately only the two ends: an intermediate
          # PHP x Laravel combination has never caught anything the brackets
          # did not, and every extra cell is a required check to maintain.
          #
          # Cell names carry no version numbers because branch protection
          # matches required checks by literal job name, so a PHP or Laravel
          # rotation must not rename a check. What each cell means is defined
          # here in the matrix.

          # The declared floors, resolved rather than assumed.
          # --prefer-stable alongside --prefer-lowest because "lowest" alone
          # takes the lowest version of any stability. This cell pins no
          # dependency version at all: the illuminate constraints are left as
          # composer.json ships them (an empty matrix.laravel makes the step
          # below skip the rewrite) and so is tag1/scolta-php, so raising
          # either floor moves this cell with it instead of leaving a stale
          # pin behind. The scolta-php floor carries @dev and no stable
          # release satisfies it yet; --prefer-stable does not change that,
          # composer still resolves the development branch, which is the
          # lowest scolta-php that exists.
          - cell: lowest
            php: '8.2'
            laravel: ''
            composer-flags: '--prefer-lowest --prefer-stable'
            lint: false
          - cell: highest
            php: '8.5'
            laravel: '13'
            composer-flags: ''
            lint: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      # The path repo is swapped for the public VCS one, and the constraint in
      # composer.json is deliberately left alone. It used to be overwritten with
      # dev-main@dev here, which meant this job never once resolved the
      # constraint this package ships: composer.json required tag1/scolta-php as
      # ^1.1.0 while src/AiProvider/Amazee/LaravelConfigStorage.php declared
      # `implements ProvenanceAwareConfigStorageInterface`, a class 1.1.0 does
      # not have, and every job in this file quietly replaced the constraint
      # before asking composer anything. A guard that edits the thing it is
      # guarding is not a guard. The shipped ^1.2@dev reaches the development
      # branch on its own, so there is nothing left to overwrite.
      - name: Replace path repo with GitHub VCS repo and pin Laravel version
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $v = "${{ matrix.laravel }}";
            // An empty matrix.laravel leaves the shipped constraints alone.
            // That is the lowest cell: it has to resolve what composer.json
            // declares, not a Laravel version restated here.
            if ($v !== "") {
                foreach (["illuminate/support","illuminate/console","illuminate/database","illuminate/routing"] as $pkg) {
                    $j["require"][$pkg] = "^{$v}.0";
                }
            }
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php ${{ matrix.composer-flags }}

      # No silent resolutions: what this cell actually tested, in the log.
      - name: Report resolved versions
        run: composer show --direct

      - name: Lint (Laravel Pint)
        if: matrix.lint
        run: composer lint

      - name: Run tests
        run: composer test

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl
          coverage: xdebug

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tail -20

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated when code changes
        # base_ref goes through an env var, not ${{ }} interpolation in the
        # script: interpolation pastes the value into the shell source, where a
        # crafted branch name would execute (run-shell-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CODE_CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            'src/' 'composer.json' 'tests/' 'config/' 'database/' 'routes/' 'resources/' | head -1)
          if [ -n "$CODE_CHANGED" ]; then
            CHANGELOG_CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- CHANGELOG.md)
            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "FAIL: Code changed but CHANGELOG.md was not updated."
              echo "Please add an entry under ## [Unreleased] in CHANGELOG.md."
              exit 1
            fi
            echo "PASS: CHANGELOG.md updated alongside code changes."
          else
            echo "SKIP: No code changes detected."
          fi

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo and pin Laravel 13
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            foreach (["illuminate/support","illuminate/console","illuminate/database","illuminate/routing"] as $pkg) {
                $j["require"][$pkg] = "^13.0";
            }
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run PHPStan (Larastan)
        run: composer analyse

  # Semgrep runs here as a real, blocking check — the same scan `composer
  # semgrep` runs locally. It used to reach PRs only through the AI reviewer,
  # which scans changed files only and reports findings as informational;
  # ai-pr-review.yml now excludes it (alongside phpcs and phpstan) so findings
  # gate the build here instead of surfacing as review comments there.
  # Pre-existing findings in .github/workflows/ are excluded via .semgrepignore
  # until they are fixed; see the note in that file.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep
        run: semgrep scan --config=auto --error

  # What the committed lock has to be true of on a branch, which is not the same
  # as what it has to be true of in a release.
  #
  # This job used to demand a stable Packagist version unconditionally. That was
  # right while the floor was a released line and became unsatisfiable the moment
  # the floor moved to ^1.2@dev: no stable scolta-php satisfies ^1.2, so the only
  # way to keep the rule would be to tag a release in order to make a constraint
  # check pass, which is the tail wagging the dog. The stable-release rule now
  # lives in release.yml alone, where it belongs and where it is a real
  # coordination gate: scolta-laravel cannot be released until scolta-php 1.2.0
  # exists.
  #
  # What remains here is the part that is true on any branch. The lock has to
  # describe the constraint beside it, and it must never point at a developer's
  # working copy.
  lock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      # A lock that no longer matches composer.json is not a slow-burning
      # inconsistency: `composer install` refuses outright, so a stale lock
      # breaks every clean checkout while every CI job here, which resolves with
      # `composer update`, stays green.
      - name: The lock must agree with the composer.json beside it
        run: composer validate --no-check-all --no-check-publish

      - name: scolta-php must not be locked from a path repository
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("composer.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("composer.lock", "utf8"));
            const constraint = (manifest.require || {})["tag1/scolta-php"];
            const pkg = [...(lock.packages || []), ...(lock["packages-dev"] || [])]
              .find((p) => p.name === "tag1/scolta-php");
            if (!constraint) { console.error("composer.json does not require tag1/scolta-php"); process.exit(1); }
            if (!pkg) { console.error("tag1/scolta-php is not in composer.lock"); process.exit(1); }

            const bad = [];
            // The path repository exists so a developer can work against a
            // sibling checkout. A lock resolved from it describes one machine.
            if ((pkg.dist || {}).type === "path") bad.push(`dist.type=path (${(pkg.dist || {}).url})`);

            // A development floor may lock either a branch or, once one exists,
            // a release that satisfies it. A released floor may only lock a
            // release: that direction is how a dev dependency would sneak into
            // a line that claims to be stable.
            const devFloor = /@dev$/.test(constraint) || constraint.startsWith("dev-");
            const stableLock = /^\d+\.\d+\.\d+$/.test(pkg.version);
            if (!devFloor && !stableLock) bad.push(`floor "${constraint}" is a released line but the lock names ${pkg.version}`);

            if (bad.length) { console.error(`LOCK GUARD FAILED for tag1/scolta-php: ${bad.join("; ")}`); process.exit(1); }
            console.log(`Lock guard OK: tag1/scolta-php ${pkg.version} via ${(pkg.dist || {}).type} against floor ${constraint}`);
          '

  antipatterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for known bad patterns
        run: |
          FAIL=0

          # IndexBuildOrchestrator::build() must be called with a logger argument.
          # (Logger/progress go to build()/finalize(), not the constructor.)
          if grep -rn 'orchestrator->build(' src/ 2>/dev/null | grep -qvE 'logger|Logger'; then
            echo "FAIL: orchestrator->build() called without a logger argument"
            grep -rn 'orchestrator->build(' src/ | grep -vE 'logger|Logger'
            FAIL=1
          fi

          # CHANGELOG.md: the [Unreleased] section must have at most one of each
          # sub-header (a merge artifact once left two ### Fixed / ### Changed
          # there; Keep-a-Changelog renderers then show two of each in the notes
          # cut at release time). Scoped to [Unreleased] — released sections are
          # frozen history and are not rewritten.
          awk '
            /^## \[Unreleased\]/ { in_unrel = 1; next }
            /^## \[/            { in_unrel = 0 }
            in_unrel && /^### / {
              if (seen[$0]++) {
                printf("FAIL: duplicate \"%s\" under ## [Unreleased] in CHANGELOG.md\n", $0) > "/dev/stderr"
                rc = 1
              }
            }
            END { exit rc }
          ' CHANGELOG.md || FAIL=1

          [ $FAIL -eq 0 ] && echo "PASS: No known bad patterns found."
          exit $FAIL

  dist-archive:
    name: Validate Composer dist archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Composer distribution archive
        run: scripts/validate-dist-archive.sh

  coherence:
    name: Version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # What this catches that the other version jobs do not.
      #
      # scolta-php#275 moved composer.json "version" to 1.2.0-dev and left
      # extra.branch-alias.dev-main on 1.1.x-dev, so for one commit the file
      # said two different things about which line it was. Nothing stopped it:
      # the retired check-version-sync.php compared only MAJOR numbers, which
      # were equal on both sides of that break, and it was wired into no
      # workflow anywhere. The version-sync job that once ran here compared
      # majors too, and has since been removed. This compares the development
      # LINE, which is where the break was.
      #
      # It cost four demos their installs: they pinned the alias line directly
      # as 1.1.x-dev, and once the alias moved to 1.2 there was nothing left to
      # resolve it.
      #
      # No setup-node step and no install: GitHub runners ship node, and
      # scripts/check-coherence.mjs is a dependency-free bundle. It is
      # generated from TypeScript in scolta-fleet and vendored here because
      # that repository is private and this one is public, so checking it out
      # would mean storing a personal access token as a secret here. Edit the
      # source there and run `npm run vendor:coherence` to regenerate.
      - name: This package must state one development line about itself
        run: node scripts/check-coherence.mjs .
